$kind: http-request
name: 'List Findings - Filtered'
method: GET
url: '{{baseUrl}}/api/findings?category=security&limit=10&skip=0'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
description: 'List findings filtered by category=security with pagination.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
      });
      if (pm.response.code === 200) {
        pm.test("limit is respected (max 10)", function () {
          const json = pm.response.json();
          pm.expect(json.items.length).to.be.at.most(10);
        });
        pm.test("limit echoed back as 10", function () {
          const json = pm.response.json();
          pm.expect(json.limit).to.equal(10);
        });
      }
