$kind: http-request
name: List Findings
method: GET
url: '{{baseUrl}}/api/findings'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
description: 'List PR review findings for the authenticated user. Supports filters: repoFullName, prNumber, category, fileContains, q, since, skip, limit.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
      });
      if (pm.response.code === 200) {
        pm.test("Response has items array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("items");
          pm.expect(json.items).to.be.an("array");
        });
        pm.test("Response has total count", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("total");
          pm.expect(json.total).to.be.a("number");
        });
        pm.test("Response has skip and limit", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("skip");
          pm.expect(json).to.have.property("limit");
        });
      }
