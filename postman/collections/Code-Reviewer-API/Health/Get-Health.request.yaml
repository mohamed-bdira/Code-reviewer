$kind: http-request
name: Get Health
method: GET
url: '{{baseUrl}}/health'
description: 'Check if the server and MongoDB are online.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
      });
      pm.test("Response has ok field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("ok");
      });
