$kind: http-request
name: Revoke API Key
method: DELETE
url: '{{baseUrl}}/api/keys/{{apiKeyId}}'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
description: 'Revoke an API key by ID. Uses the apiKeyId environment variable.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 on success or 404 if not found", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
      if (pm.response.code === 200) {
        pm.test("Response has ok: true", function () {
          const json = pm.response.json();
          pm.expect(json.ok).to.equal(true);
        });
        pm.test("Revoked key has revokedAt timestamp", function () {
          const json = pm.response.json();
          pm.expect(json.key).to.have.property("revokedAt");
        });
      }
