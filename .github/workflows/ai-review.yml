name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize] # Runs on new PRs and when new commits are pushed

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: npm install

      - name: Install Python Dependencies
        run: python -m pip install requests

      - name: Debug File System
        run: |
          echo "Checking what files exist..."
          ls -la
          echo "Checking inside .github..."
          ls -la .github/
          echo "Checking inside .github/scripts..."
          ls -la .github/scripts/ || echo "Scripts folder not found!"
          
      - name: Run AI Code Review
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/review.js')
            await script({github, context})