$kind: http-request
name: Delete Repo Config
method: DELETE
url: '{{baseUrl}}/api/repo-configs/{{repoConfigId}}'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
description: 'Delete a repo config by ID.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
      if (pm.response.code === 200) {
        pm.test("Response has ok: true", function () {
          const json = pm.response.json();
          pm.expect(json.ok).to.equal(true);
        });
      }
