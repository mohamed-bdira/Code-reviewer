$kind: http-request
name: Findings By Category
method: GET
url: '{{baseUrl}}/api/findings/by-category'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
description: 'Get finding counts grouped by category.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
      });
      if (pm.response.code === 200) {
        pm.test("Response has counts object", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("counts");
          pm.expect(json.counts).to.be.an("object");
        });
      }
