$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "testuser@example.com",
      "password": "password123"
    }
description: 'Login with email and password. Saves the JWT token to the authToken environment variable.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 on success", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });
      if (pm.response.code === 200) {
        pm.test("Response has token", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("token");
          pm.environment.set("authToken", json.token);
        });
        pm.test("Response has user object", function () {
          const json = pm.response.json();
          pm.expect(json.user).to.have.property("id");
          pm.expect(json.user).to.have.property("email");
        });
      }
      if (pm.response.code === 401) {
        pm.test("Invalid credentials returns 401", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
        });
      }
