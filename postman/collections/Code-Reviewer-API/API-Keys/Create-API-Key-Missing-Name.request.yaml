$kind: http-request
name: 'Create API Key - Missing Name'
method: POST
url: '{{baseUrl}}/api/keys'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
description: 'Create API key without a name — should return 400.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400 when name missing", function () {
        pm.expect(pm.response.code).to.equal(400);
      });
      pm.test("Error mentions name requirement", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.include("name is required");
      });
