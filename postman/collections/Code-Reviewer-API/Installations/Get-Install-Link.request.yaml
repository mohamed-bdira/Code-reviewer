$kind: http-request
name: Get GitHub Install Link
method: POST
url: '{{baseUrl}}/api/github/install-link'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
description: 'Get the GitHub App installation URL for the SPA Install button.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
      });
      if (pm.response.code === 200) {
        pm.test("Response has url", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("url");
          pm.expect(json.url).to.include("github.com");
        });
      }
