$kind: http-request
name: Update Repo Config
method: PATCH
url: '{{baseUrl}}/api/repo-configs/{{repoConfigId}}'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "enforcementLevel": "error",
      "focusAreas": ["security", "style"],
      "useAstGrep": true,
      "mergeMinScore": 80
    }
description: 'Update a repo config. Supports partial updates of enforcementLevel, focusAreas, useAstGrep, customRules, mergeMinScore.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
      if (pm.response.code === 200) {
        pm.test("Response has updated config", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("config");
        });
        pm.test("enforcementLevel updated to error", function () {
          const json = pm.response.json();
          pm.expect(json.config.enforcementLevel).to.equal("error");
        });
        pm.test("mergeMinScore is within 0-100", function () {
          const json = pm.response.json();
          pm.expect(json.config.mergeMinScore).to.be.within(0, 100);
        });
      }
