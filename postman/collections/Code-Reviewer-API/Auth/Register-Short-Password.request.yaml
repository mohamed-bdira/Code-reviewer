$kind: http-request
name: 'Register - Short Password'
method: POST
url: '{{baseUrl}}/api/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "testuser2@example.com",
      "password": "short"
    }
description: 'Register with password shorter than 8 chars — should return 400.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400 for short password", function () {
        pm.expect(pm.response.code).to.equal(400);
      });
      pm.test("Error mentions password length", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.include("Password must be at least");
      });
