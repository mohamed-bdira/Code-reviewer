$kind: http-request
name: 'Get Me - Unauthenticated'
method: GET
url: '{{baseUrl}}/api/auth/me'
description: 'Call /me without a token — should return 401.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401 when no token", function () {
        pm.expect(pm.response.code).to.equal(401);
      });
