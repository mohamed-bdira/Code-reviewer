$kind: http-request
name: 'Register - Invalid Email'
method: POST
url: '{{baseUrl}}/api/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "not-an-email",
      "password": "password123"
    }
description: 'Register with invalid email format — should return 400.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400 for invalid email", function () {
        pm.expect(pm.response.code).to.equal(400);
      });
      pm.test("Error is Invalid email", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.equal("Invalid email");
      });
